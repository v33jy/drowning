name: control_app
description: Disaster drone control & rescue monitoring app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1          # OSM map (offline-capable)
  latlong2: ^0.9.1             # LatLng type for flutter_map
  web_socket_channel: ^3.0.1   # WebSocket to FastAPI server
  flutter_riverpod: ^2.6.1     # State management
  flutter_svg: ^2.3.0          # Vector logo rendering
  http: ^1.2.1                 # Initial HTTP calls (grid definition)
  flutter_webrtc: ^1.2.0       # P2P audio call
  permission_handler: ^11.4.0  # Microphone runtime permission

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/drowning-drone-logo.svg
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 700
